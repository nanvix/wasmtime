# Linker is set via CARGO_TARGET_I686_UNKNOWN_NANVIX_LINKER env var
# (see Makefile.nanvix and examples/hello-nanvix/Makefile).
# LLD is required — GNU ld has link-ordering issues with wasmtime-platform.
[target.i686-unknown-nanvix]
rustflags = [
    "-C", "linker-flavor=ld.lld",
]

# Mirror of [patch.crates-io] from Cargo.toml — the nanvix-update-deps
# workflow reads patches from .cargo/config.toml to discover which crates
# to refresh. Keep these in sync with the entries in Cargo.toml.
[patch.crates-io]
target-lexicon = { git = "https://github.com/nanvix/target-lexicon", branch = "nanvix/v0.13.2" }
libc = { git = "https://github.com/nanvix/libc", branch = "nanvix/v0.2.183" }
