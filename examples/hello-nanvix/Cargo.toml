[package]
name = "hello-nanvix"
version = "0.1.0"
edition = "2021"
description = "Hello World Wasmtime example for Nanvix OS"

[dependencies]
wasmtime = { path = "../../crates/wasmtime", default-features = false, features = [
    "runtime",
    "std",
    "cranelift",
    "custom-virtual-memory",
] }
libc = "0.2"

[build-dependencies]
cc = "1.2"
